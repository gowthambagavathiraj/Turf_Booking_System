server.port=8080
spring.application.name=TurfBookingSystem

# H2 Database configuration (Active by default for zero-setup running)
spring.datasource.url=jdbc:h2:file:./data/turfdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Security & JWT Configuration
jwt.secret=9a6747f3b6488d55c7a40b9389ef94d87f7396f4b3607f2fc5005ecfdfb7cb06
jwt.expiration=86400000

# File Upload limit (for turf photos)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

